x-common: &common
  image: univ-is:latest
  restart: unless-stopped
  environment: &env
    DATA_DIR: /data
    TOPOLOGY_FILE: /data/topology.json
  volumes: ["data:/data"]
  depends_on:
    init: {condition: service_completed_successfully}

services:
  init:
    image: univ-is:latest
    build: .
    command: ["python", "-m", "deploy.init_data", "ft"]
    environment: {DATA_DIR: /data, TOPOLOGY_SRC: /app/deploy/topology.json}
    volumes: ["data:/data"]
    restart: "no"
  gateway-1:
    <<: *common
    container_name: gateway-1
    environment:
      <<: *env
      APP: ft.gateway
      INSTANCE_ID: gateway-1
      NODE: A
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 2s
      timeout: 2s
      retries: 2
      start_period: 3s
    ports:
      - "8000:8000"
