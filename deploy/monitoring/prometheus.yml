global:
  scrape_interval: 2s
  evaluation_interval: 2s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: university-is
    honor_labels: true            # keep the service/instance labels exported by the application
    static_configs:
      - targets: ['gateway-1:8000', 'gateway-2:8000', 'student-1:8000', 'student-2:8000', 'payment-1:8000', 'payment-2:8000', 'records-1:8000', 'records-2:8000', 'timetable-1:8000', 'timetable-2:8000', 'monitor-1:8000']
    relabel_configs:
      - source_labels: [__address__]
        regex: '(([a-z]+)-[0-9]+):[0-9]+'
        replacement: '$1'
        target_label: instance
      - source_labels: [__address__]
        regex: '(([a-z]+)-[0-9]+):[0-9]+'
        replacement: '$2'
        target_label: service
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
