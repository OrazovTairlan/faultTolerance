# Prometheus + Grafana inside the cluster (generated by deploy/generate.py)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: univ
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role                                 # least privilege: discovery of pods in this namespace only
metadata:
  name: prometheus
  namespace: univ
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: univ
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: univ}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: univ
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: university-is
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [univ]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            regex: 'true'
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '(.+);(.+)'
            replacement: '$1:$2'
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: k8s_node
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
  alerts.yml: |
    groups:
      - name: university-is
        rules:
          - alert: InstanceDown              # min_over_time: a crash + restart shorter than one scrape is still caught
            expr: min_over_time(target_up[10s]) == 0
            labels: {severity: warning}
            annotations:
              summary: "{{ $labels.instance }} failed its health check in the last 10 s (masked if a replica is up)"
          - alert: ServiceTierDown
            expr: sum by (service) (target_up) == 0
            labels: {severity: critical}
            annotations:
              summary: "no healthy replica of {{ $labels.service }}: user-visible outage"
          - alert: GatewayErrorRateHigh
            expr: (sum(rate(http_requests_total{service="gateway",code=~"5.."}[30s])) or vector(0)) / sum(rate(http_requests_total{service="gateway"}[30s])) > 0.05
            for: 10s
            labels: {severity: critical}
            annotations:
              summary: "more than 5% of user requests fail"
          - alert: DatabasePrimaryUnavailable
            expr: min(db_primary_available) == 0
            for: 2s
            labels: {severity: warning}
            annotations:
              summary: "primary database unreachable: reads served by the replica, writes journaled (HTTP 202)"
          - alert: CircuitBreakerOpen
            expr: max(gateway_circuit_open) > 0 or max(db_circuit_open) > 0
            labels: {severity: info}
            annotations:
              summary: "a circuit breaker is open (fail-fast in progress)"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: univ
  labels: {app: prometheus, tier: monitoring}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus, tier: monitoring}
      annotations:
        checksum/config: "1e44bda634b7b3a8"   # config change -> rolling restart
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-lifecycle
          ports: [{containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /-/ready, port: 9090}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /-/healthy, port: 9090}
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: tsdb, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: tsdb
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: univ
spec:
  type: NodePort
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090, nodePort: 30090}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: univ
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData: {timeInterval: 2s}
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: university-is
        type: file
        allowUiUpdates: true
        updateIntervalSeconds: 10
        options:
          path: /etc/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: univ
data:
  dependability.json: |
    {
     "title": "University IS - dependability",
     "uid": "univ-is",
     "schemaVersion": 39,
     "refresh": "5s",
     "time": {
      "from": "now-10m",
      "to": "now"
     },
     "tags": [
      "fault-tolerance"
     ],
     "panels": [
      {
       "id": 1,
       "type": "stat",
       "title": "Instances healthy",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "expr": "sum(target_up)",
         "legendFormat": "healthy",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": []
        },
        "overrides": []
       },
       "options": {},
       "description": "Replicas passing the monitor's readiness check (0.5 s polling)."
      },
      {
       "id": 2,
       "type": "stat",
       "title": "Instances down",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 6,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "expr": "count(target_up) - sum(target_up)",
         "legendFormat": "down",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [],
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 3,
       "type": "stat",
       "title": "User-visible success ratio (15s)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "expr": "1 - ((sum(rate(http_requests_total{service=\"gateway\",code=~\"5..\"}[15s])) or vector(0)) / sum(rate(http_requests_total{service=\"gateway\"}[15s])))",
         "legendFormat": "success",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [],
         "unit": "percentunit"
        },
        "overrides": []
       },
       "options": {},
       "description": "Share of requests answered by the gateways without a 5xx (= measured availability)."
      },
      {
       "id": 4,
       "type": "stat",
       "title": "Writes queued in journal",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 18,
        "y": 0,
        "w": 6,
        "h": 4
       },
       "targets": [
        {
         "expr": "max(db_journal_pending) or vector(0)",
         "legendFormat": "pending",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [],
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       },
       "options": {},
       "description": "Store-and-forward outbox: writes accepted with HTTP 202 while the primary DB is down."
      },
      {
       "id": 5,
       "type": "state-timeline",
       "title": "Health checks per instance (monitor, 0.5 s polling)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 4,
        "w": 24,
        "h": 9
       },
       "targets": [
        {
         "expr": "target_up",
         "legendFormat": "{{instance}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [
          {
           "type": "value",
           "options": {
            "1": {
             "text": "UP",
             "color": "green",
             "index": 0
            },
            "0": {
             "text": "DOWN",
             "color": "red",
             "index": 1
            }
           }
          }
         ]
        },
        "overrides": []
       },
       "options": {
        "showValue": "never",
        "mergeValues": true
       }
      },
      {
       "id": 6,
       "type": "timeseries",
       "title": "Request rate by instance (req/s)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 13,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum by (instance) (rate(http_requests_total[15s]))",
         "legendFormat": "{{instance}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [],
         "unit": "reqps"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 7,
       "type": "timeseries",
       "title": "Failed requests (5xx/s) by instance",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 13,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum(rate(http_requests_total{code=~\"5..\"}[15s])) or vector(0)",
         "legendFormat": "all instances",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        },
        {
         "expr": "sum by (instance) (rate(http_requests_total{code=~\"5..\"}[15s]))",
         "legendFormat": "{{instance}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "B"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [],
         "unit": "reqps"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 8,
       "type": "timeseries",
       "title": "Mean latency by instance",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 21,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum by (instance) (rate(http_request_duration_seconds_sum[15s])) / sum by (instance) (rate(http_request_duration_seconds_count[15s]))",
         "legendFormat": "{{instance}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [],
         "unit": "s"
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 9,
       "type": "timeseries",
       "title": "Faults masked by the gateway (events/s)",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 21,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "sum(rate(gateway_retries_total[15s]))",
         "legendFormat": "retry on another replica",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        },
        {
         "expr": "sum(rate(gateway_stale_total[15s]))",
         "legendFormat": "stale-cache answer (degraded)",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "B"
        },
        {
         "expr": "sum(rate(gateway_shed_total[15s]))",
         "legendFormat": "load shed (priority)",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "C"
        },
        {
         "expr": "sum(rate(gateway_failed_total[15s]))",
         "legendFormat": "not masked -> 503",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "D"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": [],
         "unit": "ops"
        },
        "overrides": []
       },
       "options": {},
       "description": "Retries with backoff, graceful degradation and load shedding as they happen."
      },
      {
       "id": 10,
       "type": "timeseries",
       "title": "Circuit breakers open",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 0,
        "y": 29,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "(sum(gateway_circuit_open) + sum(db_circuit_open)) or vector(0)",
         "legendFormat": "open breakers (total)",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        },
        {
         "expr": "sum by (target) (gateway_circuit_open) > 0",
         "legendFormat": "gateway -> {{target}}",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "B"
        },
        {
         "expr": "max by (instance) (db_circuit_open) > 0",
         "legendFormat": "{{instance}} -> primary DB",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "C"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": []
        },
        "overrides": []
       },
       "options": {}
      },
      {
       "id": 11,
       "type": "timeseries",
       "title": "Database: primary availability, replica failover, journal",
       "datasource": {
        "type": "prometheus",
        "uid": "prometheus"
       },
       "gridPos": {
        "x": 12,
        "y": 29,
        "w": 12,
        "h": 8
       },
       "targets": [
        {
         "expr": "min(db_primary_available)",
         "legendFormat": "primary available (min over services)",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "A"
        },
        {
         "expr": "sum(rate(db_replica_reads_total[15s]))",
         "legendFormat": "reads served by replica /s",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "B"
        },
        {
         "expr": "max(db_journal_pending)",
         "legendFormat": "journal pending",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "C"
        },
        {
         "expr": "sum(rate(db_journal_replayed_total[15s]))",
         "legendFormat": "journal replayed /s",
         "datasource": {
          "type": "prometheus",
          "uid": "prometheus"
         },
         "refId": "D"
        }
       ],
       "fieldConfig": {
        "defaults": {
         "mappings": []
        },
        "overrides": [
         {
          "matcher": {
           "id": "byName",
           "options": "primary available (min over services)"
          },
          "properties": [
           {
            "id": "custom.axisPlacement",
            "value": "right"
           },
           {
            "id": "min",
            "value": 0
           },
           {
            "id": "max",
            "value": 1
           },
           {
            "id": "custom.lineWidth",
            "value": 3
           }
          ]
         }
        ]
       },
       "options": {}
      }
     ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: univ
  labels: {app: grafana, tier: monitoring}
spec:
  replicas: 1
  selector:
    matchLabels: {app: grafana}
  template:
    metadata:
      labels: {app: grafana, tier: monitoring}
    spec:
      securityContext: {fsGroup: 472}
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin}
            - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/dependability.json}
          ports: [{containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: provisioning, mountPath: /etc/grafana/provisioning}
            - {name: dashboards, mountPath: /etc/grafana/dashboards}
            - {name: storage, mountPath: /var/lib/grafana}
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - {key: datasource.yml, path: datasources/prometheus.yml}
              - {key: dashboards.yml, path: dashboards/university-is.yml}
        - name: dashboards
          configMap: {name: grafana-dashboards}
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: univ
spec:
  type: NodePort
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000, nodePort: 30300}]
