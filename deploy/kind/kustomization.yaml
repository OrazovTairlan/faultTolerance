# kubectl apply -k deploy/kind     (generated by deploy/generate.py)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
  - shared-pv.yaml
patches:
  - target: {kind: PersistentVolumeClaim, name: data}     # bind to the shared hostPath volume
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: shared
  - target: {kind: Deployment, labelSelector: tier=monitoring}   # monitoring on the control plane
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {node-role.kubernetes.io/control-plane: ""}
      - op: add
        path: /spec/template/spec/tolerations
        value: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
  - target: {kind: StatefulSet, name: monitor}            # health monitor too, so it can report the failure
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {node-role.kubernetes.io/control-plane: ""}
      - op: add
        path: /spec/template/spec/tolerations
        value: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
