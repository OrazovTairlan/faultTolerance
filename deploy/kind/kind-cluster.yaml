# kind create cluster --name univ --config deploy/kind/kind-cluster.yaml   (generated by deploy/generate.py)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane              # also hosts monitoring, so it survives a worker failure
    extraMounts: [{hostPath: /tmp/univ-shared, containerPath: /shared}]   # stands in for an NFS share
    extraPortMappings:                # NodePorts reachable on localhost
      - {containerPort: 30080, hostPort: 30080}   # gateway
      - {containerPort: 30090, hostPort: 30090}   # prometheus
      - {containerPort: 30300, hostPort: 30300}   # grafana
  - role: worker                     # node A
    extraMounts: [{hostPath: /tmp/univ-shared, containerPath: /shared}]   # stands in for an NFS share
  - role: worker                     # node B
    extraMounts: [{hostPath: /tmp/univ-shared, containerPath: /shared}]   # stands in for an NFS share
